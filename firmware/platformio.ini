; cardiag firmware — ESP32-CAN-X2 (Autosport Labs)
; https://wiki.autosportlabs.com/ESP32-CAN-X2
;
; Board is an ESP32-S3-WROOM-1-N8R8. The official PlatformIO "espressif32"
; platform is still on Arduino core 2.x, which does not properly support the
; S3 with core 3.x — so we use the pioarduino community fork.
;
; PSRAM is deliberately NOT enabled here. Phase 0 does not need it and every
; build flag is a potential bring-up failure mode. It gets turned on in Phase 2
; when the Tier-A ring buffer actually wants the 8 MB.

[env:esp32-can-x2]
; PINNED to the exact release already cached locally (verified 2026-09-22:
; ~/.platformio/platforms/espressif32 reports version 55.03.311 from the
; pioarduino repo). "stable" is a moving target -- if it advances, a build
; silently pulls a new platform and toolchain set, which is both a surprise
; download and a reproducibility hole.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; The WROOM-1-N8R8 carries 8 MB of OCTAL PSRAM. Arduino will not touch it
; without both the memory_type below and BOARD_HAS_PSRAM; get either wrong and
; ps_malloc silently returns null rather than failing loudly.
board_build.arduino.memory_type = qio_opi

; Deliberate partition layout with TWO OTA app slots (the hub spec wants signed
; A/B updates with rollback). 2 MB per slot + 3.875 MB LittleFS.
; See docs/hub-integration-plan.md for the sizing and the measured retention.
; NOTE: changing this re-flashes the partition table. nvs stays at 0x9000/0x5000
; so the boot counter survives, but the first upload after this change should be
; a full erase if anything looks odd.
board_build.partitions = partitions_cardiag_8mb.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    ; Board def sets ARDUINO_USB_MODE=1 (native USB-Serial-JTAG) but leaves
    ; CDC_ON_BOOT at 0, which routes Serial to UART0 (GPIO43/44) instead of
    ; the USB port. Without this the upload succeeds and the monitor is silent.
    -DARDUINO_USB_CDC_ON_BOOT=1

; The board test dir is empty on purpose -- test/ holds HOST tests only, and
; without this `pio run` would try to build them for the ESP32 too.
test_ignore = test_*

; ---------------------------------------------------------------------------
; HOST tests.  pio test -e native
;
; Only modules with no Arduino/FreeRTOS dependency can live here, which is a
; deliberate constraint rather than a limitation: it is what forced the packet
; serialiser out of hubstream.cpp, where its >64-record split path could not be
; reached by any test and was in practice never executed at all.
;
; Add a module here only after it compiles against stdint + string.h alone.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -I include
    -Wall
build_src_filter = +<hubchunk.cpp>

; ---------------------------------------------------------------------------
; SPLIT TEST build. Identical firmware, except a datagram holds 8 records
; instead of 64.
;
; WHY THIS EXISTS ALONGSIDE THE HOST TEST. At the default cap the multi-packet
; split is UNREACHABLE on the device -- SNIFF_MAX_IDS (64) equals
; HUB_MAX_RECORDS (64), so a snapshot cannot produce a 65th row. The host test
; proves the serialiser is correct; this proves the whole path is, on a real
; radio with a real hub counting real datagrams.
;
; With the 14-id SELFTEST profile, every full snapshot becomes 2 packets:
;   pio run -e esp32-can-x2-splittest -t upload
;   python ../../carhub/tools/fastcheck.py --logger http://<ip> --seconds 15
; Expect roughly double the packet count for the same record count, seq_gaps 0,
; and every id present exactly once per snapshot.
;
; ⚠ NOT A SHIPPING BUILD. 8 records/packet is ~8x the header overhead.
; ---------------------------------------------------------------------------
[env:esp32-can-x2-splittest]
extends = env:esp32-can-x2
build_flags =
    ${env:esp32-can-x2.build_flags}
    -DHUB_MAX_RECORDS=8
