; cardiag firmware — ESP32-CAN-X2 (Autosport Labs)
; https://wiki.autosportlabs.com/ESP32-CAN-X2
;
; Board is an ESP32-S3-WROOM-1-N8R8. The official PlatformIO "espressif32"
; platform is still on Arduino core 2.x, which does not properly support the
; S3 with core 3.x — so we use the pioarduino community fork.
;
; PSRAM is deliberately NOT enabled here. Phase 0 does not need it and every
; build flag is a potential bring-up failure mode. It gets turned on in Phase 2
; when the Tier-A ring buffer actually wants the 8 MB.

[env:esp32-can-x2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; The WROOM-1-N8R8 carries 8 MB of OCTAL PSRAM. Arduino will not touch it
; without both the memory_type below and BOARD_HAS_PSRAM; get either wrong and
; ps_malloc silently returns null rather than failing loudly.
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    ; Board def sets ARDUINO_USB_MODE=1 (native USB-Serial-JTAG) but leaves
    ; CDC_ON_BOOT at 0, which routes Serial to UART0 (GPIO43/44) instead of
    ; the USB port. Without this the upload succeeds and the monitor is silent.
    -DARDUINO_USB_CDC_ON_BOOT=1
